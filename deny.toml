[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
allow = [
    # GPL-3.0: this crate and the vendored VanitySearch code
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Zlib",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
    # Ubuntu Font Licence ships with the egui font assets
    "Ubuntu-font-1.0",
    "OFL-1.1",
    "Unlicense",
    "MPL-2.0",
    "BSL-1.0",
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
