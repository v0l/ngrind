[package]
name = "ngrind-web"
description = "ngrind in the browser, on WebGPU"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
ngrind = { path = "../ngrind", default-features = false, features = ["wgpu"] }
ngrind-ui = { path = "../ngrind-ui", default-features = false, features = ["wgpu"] }
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "persistence"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "Document", "Element", "HtmlCanvasElement", "Window"] }
console_error_panic_hook = "0.1"
