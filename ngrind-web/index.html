<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ngrind: vanity npubs and proof of work in your browser</title>
<meta name="description" content="Mine vanity npubs and NIP-13 proof of work events on your GPU, in the browser. Nothing leaves your machine.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17191d">
<style>
  html, body { margin: 0; height: 100%; background: #17191d; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; outline: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #8b929c; font: 14px sans-serif; letter-spacing: .12em; text-transform: uppercase; }
</style>
</head>
<body>
<div id="loading">loading</div>
<canvas id="ngrind"></canvas>
<script type="module">
  const loading = document.getElementById("loading");
  if (!self.crossOriginIsolated) {
    loading.textContent = "ngrind needs a cross-origin isolated page (COOP and COEP headers) to run its worker threads";
  } else {
    const { default: init, initThreadPool, start } = await import("./ngrind_web.js");
    await init();
    const asked = Number(new URLSearchParams(location.search).get("threads"));
    await initThreadPool(asked > 0 ? asked : navigator.hardwareConcurrency);
    start();
  }
</script>
</body>
</html>
