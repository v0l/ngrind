name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --locked --no-default-features --features wgpu --workspace --exclude ngrind-web
      - run: cargo build --locked --release --no-default-features --features wgpu --workspace --exclude ngrind-web

  cuda:
    runs-on: ubuntu-22.04
    container: nvidia/cuda:12.6.3-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: apt-get update && apt-get install -y curl build-essential pkg-config libwayland-dev libxkbcommon-dev libx11-dev
      - run: curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: NGRIND_CUDA_ARCHS=75,80,86,89,90 cargo build --locked --release --workspace

  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: sudo apt-get update && sudo apt-get install -y clang
      - run: ./ngrind-web/build.sh
